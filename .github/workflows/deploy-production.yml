name: Deploy to Production

# Promotes test to production by merging it into main.
# Cloudflare Pages (project "api-docs", Git integration) builds and deploys
# main to docs.zooza.online on its own when main is pushed.

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/test
          git push origin main
